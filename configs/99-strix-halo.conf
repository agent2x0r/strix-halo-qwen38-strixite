# Strix Halo unified-memory LLM serving tuning
# Install to /etc/sysctl.d/99-strix-halo.conf and run: sudo sysctl --system

# Avoid swapping out active server / model host pages under unified-memory pressure
vm.swappiness = 1

# Bias toward retaining dentry/inode/page cache for the 48.3 GiB on-disk n-gram table
vm.vfs_cache_pressure = 50

# Cap dirty writeback queues in bytes (default 10%/20% of 128 GiB = 12.5-25 GiB stalls NVMe flushes)
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 536870912
